# Elasticsearch 8 + Kibana for HelpOrbit activity logs & analytics.
# Usage:
#   docker compose -f docker-compose.elasticsearch.yml up -d
#   curl http://localhost:9200   # ES
#   open http://localhost:5601   # Kibana
#
# Backend .env:
#   ELASTIC_URL=http://localhost:9200
#   ELASTIC_ENABLED=true
#   ELASTIC_AUDIT_LOGS_INDEX=helporbit-audit-logs

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: helporbit-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=helporbit
    ports:
      - "9200:9200"
    volumes:
      - helporbit_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: helporbit-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "5601:5601"

volumes:
  helporbit_es_data:
